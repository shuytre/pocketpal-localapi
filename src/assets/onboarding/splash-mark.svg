<svg preserveAspectRatio="xMidYMid meet" width="100%" height="100%" overflow="visible" style="display: block;" viewBox="0 0 112 112" fill="none" xmlns="http://www.w3.org/2000/svg">
<!--
  TwinCore splash mark — replaces the upstream PocketPal "Pip" yellow mascot.

  Same contract as the asset it replaces: 112x112 viewBox, mark on a
  transparent surround, so `SplashMark` keeps its existing width/height props
  untouched. Motif is the app icon's twin-core: two stacked mint cores
  (performance + efficiency) on a deep-navy slab, bridged by a hollow node.
-->
<defs>
  <linearGradient id="twinCoreSlab" x1="0" y1="0" x2="112" y2="112" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#16233F"/>
    <stop offset="1" stop-color="#0A0E1A"/>
  </linearGradient>
  <linearGradient id="twinCoreMint" x1="34" y1="26" x2="80" y2="52" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#00E5A0"/>
    <stop offset="1" stop-color="#00B283"/>
  </linearGradient>
  <clipPath id="twinCoreClip">
    <rect width="112" height="112" rx="26"/>
  </clipPath>
</defs>

<g clip-path="url(#twinCoreClip)">
  <!-- Deep-navy base slab, same radius family as the launcher icon. -->
  <rect width="112" height="112" rx="26" fill="url(#twinCoreSlab)"/>

  <!-- Specular top rim: the thin bright edge that reads as glass. -->
  <path d="M16 3.2 H96" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2" stroke-linecap="round"/>

  <!-- Performance core (top). -->
  <rect x="30" y="26" width="52" height="26" rx="9" fill="url(#twinCoreMint)"/>
  <path d="M40 39 H72" stroke="#0A0E1A" stroke-width="3.4" stroke-linecap="round"/>

  <!-- Efficiency core (bottom), slightly dimmer so the pair reads as a stack. -->
  <rect x="30" y="60" width="52" height="26" rx="9" fill="#00B283" fill-opacity="0.85"/>
  <path d="M40 73 H72" stroke="#0A0E1A" stroke-width="3.4" stroke-linecap="round"/>

  <!-- Hollow node bridging the two cores: the "twin" link. -->
  <rect x="48.5" y="48.5" width="15" height="15" rx="3.2" transform="rotate(45 56 56)" fill="#0A0E1A" stroke="#F1F5F9" stroke-width="2.6"/>

  <!-- Dual lanes exiting right, echoing the icon's CPU + NPU bus. -->
  <path d="M84 39 H96" stroke="#00E5A0" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M84 73 H96" stroke="#00B283" stroke-width="3.4" stroke-linecap="round" stroke-opacity="0.85"/>
</g>
</svg>
