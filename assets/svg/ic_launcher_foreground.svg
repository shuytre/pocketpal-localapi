    <!-- Dual lanes -->
    <path d="M 286 256 H 430" stroke="#00E5A0" stroke-width="16" stroke-linecap="round"/>
    <path d="M 226 256 H 82" stroke="#00E5A0" stroke-width="16" stroke-linecap="round"/>

    <!-- Orbit ring -->
    <path d="M 94.9 163 A 186 186 0 0 1 417.1 163" stroke="#3B82F6" stroke-width="24" fill="none" stroke-linecap="round"/>
    <path d="M 417.1 349 A 186 186 0 0 1 94.9 349" stroke="#3B82F6" stroke-width="24" fill="none" stroke-linecap="round"/>

    <!-- Twin cores -->
