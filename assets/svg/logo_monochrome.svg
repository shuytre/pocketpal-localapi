<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="TwinCore monochrome mark">
  <!-- TwinCore monochrome mark — single color, layered opacity -->
  <!-- Orbit ring -->
  <path d="M 94.9 163 A 186 186 0 0 1 417.1 163" stroke="#F1F5F9" stroke-width="22" fill="none" stroke-linecap="round" opacity="0.55"/>
  <path d="M 417.1 349 A 186 186 0 0 1 94.9 349" stroke="#F1F5F9" stroke-width="22" fill="none" stroke-linecap="round" opacity="0.55"/>

  <!-- Dual lanes -->
  <path d="M 286 256 H 430" stroke="#F1F5F9" stroke-width="14" stroke-linecap="round" opacity="0.45"/>
  <path d="M 226 256 H 82" stroke="#F1F5F9" stroke-width="14" stroke-linecap="round" opacity="0.45"/>

  <!-- Twin cores -->
  <rect x="176" y="112" width="160" height="108" rx="28" fill="#F1F5F9"/>
  <rect x="176" y="292" width="160" height="108" rx="28" fill="#F1F5F9"/>

  <!-- Bridge + NPU node (solid) -->
  <path d="M 256 224 V 234 M 256 278 V 288" stroke="#F1F5F9" stroke-width="16" stroke-linecap="round"/>
  <path d="M 256 226 L 286 256 L 256 286 L 226 256 Z" fill="#F1F5F9"/>
</svg>
