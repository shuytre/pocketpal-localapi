<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="TwinCore mark">
  <!-- TwinCore logo mark — "twin cores, dual lanes" -->
  <!-- Background plate -->
  <defs>
    <radialGradient id="tcPlate" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0" stop-color="#16233F"/>
      <stop offset="1" stop-color="#0A0E1A"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#tcPlate)"/>

  <!-- Orbit ring with twin gaps (left/right) -->
  <path d="M 94.9 163 A 186 186 0 0 1 417.1 163" stroke="#3B82F6" stroke-width="22" fill="none" stroke-linecap="round"/>
  <path d="M 417.1 349 A 186 186 0 0 1 94.9 349" stroke="#3B82F6" stroke-width="22" fill="none" stroke-linecap="round"/>

  <!-- Dual lanes: CPU lane + NPU lane meeting the ring gaps -->
  <path d="M 286 256 H 430" stroke="#00E5A0" stroke-width="14" stroke-linecap="round"/>
  <path d="M 226 256 H 82" stroke="#00E5A0" stroke-width="14" stroke-linecap="round"/>

  <!-- Twin cores -->
  <rect x="176" y="112" width="160" height="108" rx="28" fill="#00E5A0"/>
  <rect x="206" y="146" width="100" height="13" rx="6.5" fill="#0A0E1A" opacity="0.5"/>
  <rect x="206" y="172" width="68" height="13" rx="6.5" fill="#0A0E1A" opacity="0.5"/>

  <rect x="176" y="292" width="160" height="108" rx="28" fill="#3B82F6"/>
  <rect x="206" y="326" width="100" height="13" rx="6.5" fill="#0A0E1A" opacity="0.5"/>
  <rect x="206" y="352" width="68" height="13" rx="6.5" fill="#0A0E1A" opacity="0.5"/>

  <!-- Bridge -->
  <path d="M 256 224 V 234 M 256 278 V 288" stroke="#F1F5F9" stroke-width="16" stroke-linecap="round"/>

  <!-- NPU node (hollow diamond) -->
  <path d="M 256 226 L 286 256 L 256 286 L 226 256 Z" fill="#F1F5F9"/>
  <path d="M 256 243 L 269 256 L 256 269 L 243 256 Z" fill="#0A0E1A"/>
</svg>
