# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx512m -XX:MaxMetaspaceSize=256m
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# TwinCore: 模块级并行 + 构建缓存（配合 .github/workflows/build.yml）。
# 注意：不设 org.gradle.workers.max —— 免费 runner 实际 2 核，run #9 实测
# workers.max=4 会让多个 Kotlin 编译 worker 同时抢内存，触发
# GradleCompilerRunnerWithWorkers 失败（且日志里没有 e: 行，是 worker 层崩溃）。
# 2 worker 是 run #7 实测能跑通全部 Kotlin 编译的已知良好配置。
org.gradle.parallel=true
org.gradle.caching=true
# Kotlin daemon 单独封顶，防止它和 Gradle daemon（2g）叠加挤爆 7GB runner
# —— run #9/#10 的 :app:compileProdDebugKotlin 静默失败疑似就是 OOM killer
# 击杀了 Kotlin daemon（无 e: 行是它的典型特征）。
kotlin.daemon.jvmargs=-Xmx1500m

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Use this property to specify which architecture you want to build.
# You can also override it from the CLI using
# ./gradlew <task> -PreactNativeArchitectures=x86_64
# TwinCore：目标设备只有红米 K20（arm64-v8a），锁定单一 ABI 以减小体积、
# 并减少 CI 里 native 编译的轮次。
reactNativeArchitectures=arm64-v8a

# Use this property to enable support to the new architecture.
# This will allow you to use TurboModules and the Fabric render in
# your application. You should enable this flag either if you want to
# write custom TurboModules/Fabric components OR use libraries that
# are providing them.
newArchEnabled=true

# Use this property to enable or disable the Hermes JS engine.
# If set to false, you will be using JSC instead.
hermesEnabled=true

# --- TwinCore / llama.rn 后端开关 ------------------------------------------
#
# Hexagon HTP(NPU) 与 Adreno OpenCL(GPU) 后端由 llama.rn 的预编译变体
# librnllama_v8_2_dotprod_i8mm_hexagon_opencl.so 提供。该 .so 不在 npm
# tarball 内，而是由 llama.rn 的 postinstall
#   node ./install/download-native-artifacts.js
# 下载到 node_modules/llama.rn/android/src/main/jniLibs；
# 同时 bin/arm64-v8a 下的 libggml-htp-*.so 会被同步到 app 的
# assets/ggml-hexagon/（llama.rn 的 syncRNLlamaHtpAssets 任务）。
#
# 因此这里保持 false。改成 true 会切换成「在本地编译 llama.cpp」，代价是：
#   1. 需要 HEXAGON_SDK_ROOT / HEXAGON_TOOLS_ROOT
#      （默认 ~/.hexagon-sdk/6.4.0.2）。GitHub Actions 上拿不到 SDK，
#      llama.rn 会打印 "Hexagon SDK not found — building CPU-only"
#      并退化成纯 CPU 构建 —— 反而把 Hexagon 和 OpenCL 都丢了；
#   2. 7 个 ARM CPU-feature 变体逐个编译，CI 时间从约 10 分钟涨到 40 分钟以上。
#
# 只有当你确实要改 ggml 源码、且已备好 Hexagon SDK 时才置为 true。
# 另外：CPU 亲和性修复（上游 PR #26838）在预编译产物里已经生效，
# 不需要为了它而打开源码构建。
rnllamaBuildFromSource=false
