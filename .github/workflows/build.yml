name: Build TwinCore APK

# TwinCore 主构建流水线：
#   - push 到 main / 手动触发
#   - yarn + Gradle + Android SDK 三层缓存
#   - 4 核并行编译（--max-workers=4 + org.gradle.parallel）
#   - 产物 app-debug.apk 自动发布到 tag v1.0.<run_number> 的 GitHub Release
#     直链格式：https://github.com/<owner>/<repo>/releases/download/v1.0.<run_number>/app-debug.apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-twincore-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 仓库不提交 yarn.lock（CI 端 yarn install 现场解析），而 setup-node
      # 的 yarn 缓存强依赖 lockfile 存在，故改用 actions/cache 缓存全局包缓存
      - name: Cache yarn packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/yarn
          key: yarn-${{ runner.os }}-${{ hashFiles('**/package.json') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      # —— 缓存层 1/3：Android SDK + NDK（体量最大，命中可省 ~6 分钟） ——
      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk
          key: android-sdk-${{ runner.os }}-ndk27.3.13750724-cmake3.22.1
          restore-keys: |
            android-sdk-${{ runner.os }}-

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.3.13750724 cmake;3.22.1'

      # —— 缓存层 2/3：Gradle 用户缓存 + CMake 中间产物 ——
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/*.gradle', 'android/**/*.gradle', 'android/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: android/app/.cxx
          key: cmake-${{ runner.os }}-${{ hashFiles('android/app/src/main/jni/CMakeLists.txt', 'android/app/build.gradle') }}
          restore-keys: |
            cmake-${{ runner.os }}-

      - name: Create placeholder google-services.json
        run: |
          cat > android/app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "123456789000",
              "project_id": "twincore-placeholder"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789000:android:1234567890abcdef",
                  "android_client_info": {
                    "package_name": "com.twincore"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyPlaceholderKeyPlaceholderKey"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Fix permission for shell scripts
        run: chmod +x ./scripts/*.sh

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # TwinCore：launcher PNG 不进 git —— 从 assets/svg/ 唯一样式源实时导出
      # （mdpi 48 / hdpi 72 / xhdpi 96 / xxhdpi 144 / xxxhdpi 192 + adaptive 108dp）。
      - name: Export launcher PNGs from SVG sources
        run: yarn svg:export

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # —— 编译（吃满 runner 可用核心）。 ——
      # JVM 参数必须保留 MaxMetaspaceSize：RNGP 的 Kotlin 编译在并行下
      # 会同时起多个编译器，Metaspace 不够会直接编译失败。
      # CMAKE_BUILD_PARALLEL_LEVEL 让 NDK/CMake 侧也并行。
      # Kotlin 编译走 in-process（在 Gradle daemon 堆内），不再 fork 独立
      # Kotlin daemon —— run #9 实测 4 worker 下 worker 进程层崩溃且无 e: 行，
      # in-process 彻底消除这一类故障。
      - name: Build Debug APK (arm64)
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g"
          CMAKE_BUILD_PARALLEL_LEVEL: "4"
        run: |
          cd android
          set -o pipefail
          ./gradlew assembleProdDebug \
            --console=plain \
            --stacktrace \
            --parallel \
            --build-cache \
            -Pkotlin.compiler.execution.strategy=in-process \
            -PreactNativeArchitectures=arm64-v8a 2>&1 | tee /tmp/gradle-build.log

      # —— 失败诊断闭环：Gradle 关键错误行以 ::error:: 输出为 check annotations，
      #    无需任何写权限即可从 API 读回。最后 60 行兜底 —— 保证任何形式的
      #    失败（含无 e: 行的 worker 崩溃）都能看到真实报错。 ——
      - name: Emit build error annotations
        if: failure()
        run: |
          tr '\r' '\n' < /tmp/gradle-build.log 2>/dev/null > /tmp/g.log || true
          echo "=== FAILURE block ==="
          awk '/FAILURE: Build failed/{f=1} f{print; c++; if(c>32) exit}' /tmp/g.log | grep -v '^[[:space:]]*$' | cut -c1-450 | while IFS= read -r l; do echo "::error::$l"; done
          echo "=== kotlin/compiler error lines ==="
          grep -E '^e: |error: |Unresolved reference|OutOfMemory|Kotlin daemon|Caused by:' /tmp/g.log | head -n 12 | cut -c1-450 | while IFS= read -r l; do echo "::error::$l"; done
          echo "=== tail 60 lines (fallback) ==="
          tail -n 60 /tmp/g.log | grep -v '^[[:space:]]*$' | cut -c1-450 | while IFS= read -r l; do echo "::error::$l"; done

      - name: Collect APK
        run: |
          set -eux
          mkdir -p dist
          # flavor 构建产物名：app-prod-debug.apk（e2eDebug 一并产出但不发布）
          find android/app/build/outputs/apk -name '*.apk' -type f | head -20
          cp android/app/build/outputs/apk/prod/debug/app-prod-debug.apk dist/app-debug.apk
          ls -la dist/

      # —— 缓存层 3/3：Hermes/llama.rn 原生产物已随 Gradle 缓存覆盖 ——
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: TwinCore v1.0.${{ github.run_number }}
          body: |
            TwinCore 自动构建（commit ${{ github.sha }}）。

            **安装**：下载 app-debug.apk → 允许安装未知来源 → 安装。
            包名 `com.twincore`，与 PocketPal 官方版可并存。

            构建：`assembleProdDebug`（arm64-v8a）· JDK 17 · Gradle 4-worker 并行。
          files: dist/app-debug.apk
          fail_on_unmatched_files: true

      - name: Output release URL
        run: |
          TAG="v1.0.${{ github.run_number }}"
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/app-debug.apk"
          echo "APK 直链: $URL" >> $GITHUB_STEP_SUMMARY
          echo "Release 直链：$URL"
